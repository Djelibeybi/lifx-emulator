name: CI

on:
  push:
    branches:
    - main
  pull_request:

env:
  PYTHON_VERSION: '3.14'
  UV_VERSION: 0.9.9

# Default to least privilege; jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      mdns_spike: ${{ steps.filter.outputs.mdns_spike }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      id: filter
      with:
        filters: |
          source:
            - 'packages/**'
            - 'pyproject.toml'
            - 'uv.lock'
          mdns_spike:
            - '.github/workflows/ci.yml'
            - 'scripts/spike_mdns_candidates.py'
            - 'scripts/mdns_spike_tests/**'
            - 'scripts/mdns_spike_inputs/**'

  mdns-spike-evidence:
    name: mDNS spike evidence (${{ matrix.os }})
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened", "reopened", "ready_for_review", "synchronize"]'),
      github.event.action)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    concurrency:
      group: mdns-spike-${{ github.event.pull_request.number }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      with:
        fetch-depth: 0

    - name: Decide whether exact synchronize inputs changed
      id: expensive
      env:
        ACTION: ${{ github.event.action }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.event.after }}
        FULL_PR_FILTER: ${{ needs.changes.outputs.mdns_spike }}
      shell: bash
      run: |
        run=false
        reason=full-pr-filter
        if [[ "$ACTION" == "synchronize" ]]; then
          run=true
          reason=conservative-missing-sha-or-diff
          if [[ -n "$BEFORE" && -n "$AFTER" ]] \
            && git fetch --no-tags origin "$BEFORE" "$AFTER" \
            && changed=$(git diff --name-only "$BEFORE" "$AFTER"); then
            if grep -Eq '^(\.github/workflows/ci\.yml|scripts/spike_mdns_candidates\.py|scripts/mdns_spike_tests/|scripts/mdns_spike_inputs/)' <<<"$changed"; then
              run=true
              reason=synchronize-input-change
            else
              run=false
              reason=synchronize-receipt-only
            fi
          fi
        elif [[ "$FULL_PR_FILTER" == "true" ]]; then
          run=true
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      if: steps.expensive.outputs.run == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      if: steps.expensive.outputs.run == 'true'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4   # v10.1.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Prepare host daemon, synthetic ULA and exact oracle
      if: steps.expensive.outputs.run == 'true'
      env:
        SOURCE_REVISION: 48b7efbff59656499373b13ef17e3008d125feb5
      shell: bash
      run: |
        set -euo pipefail
        git init "$RUNNER_TEMP/lifx-async"
        git -C "$RUNNER_TEMP/lifx-async" remote add origin \
          https://github.com/Djelibeybi/lifx-async.git
        git -C "$RUNNER_TEMP/lifx-async" fetch --depth 1 origin "$SOURCE_REVISION"
        git -C "$RUNNER_TEMP/lifx-async" checkout --detach FETCH_HEAD
        test "$(git -C "$RUNNER_TEMP/lifx-async" rev-parse HEAD)" = "$SOURCE_REVISION"
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y avahi-daemon
          sudo systemctl start avahi-daemon
          sudo ip -6 addr add fd00:3:1::1/128 dev lo
          pgrep -x avahi-daemon
        else
          pgrep -x mDNSResponder
          mdns_interface=$(route -n get -inet 224.0.0.251 | \
            awk '/interface:/{print $2}')
          test -n "$mdns_interface"
          sudo ifconfig "$mdns_interface" inet6 fd00:3:1::1 prefixlen 64 alias
        fi
        echo "MDNS_SPIKE_THREAD_ADDRESS_ORIGIN=runner-configured-synthetic-ula" \
          >> "$GITHUB_ENV"

    - name: Exercise exact candidate head
      if: steps.expensive.outputs.run == 'true'
      env:
        EVIDENCE: mdns-spike-${{ runner.os }}-${{ runner.arch }}.json
        MDNS_SPIKE_ORACLE_PATH: ${{ runner.temp }}/lifx-async
      run: |
        uv run --frozen pytest scripts/mdns_spike_tests/test_candidates.py -q --no-cov
        uv run --frozen python scripts/spike_mdns_candidates.py \
          run-direct-platform --output "$EVIDENCE"

    - name: Record exact-head receipt
      if: steps.expensive.outputs.run == 'true'
      env:
        EVIDENCE: mdns-spike-${{ runner.os }}-${{ runner.arch }}.json
        RECEIPT: mdns-spike-${{ runner.os }}-${{ runner.arch }}-receipt.json
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: >-
        uv run --frozen python scripts/spike_mdns_candidates.py write-ci-receipt
        --evidence "$EVIDENCE" --output "$RECEIPT" --head-sha "$HEAD_SHA"
        --run-url "$RUN_URL" --platform-leg multicast

    - name: Show provisional or failed evidence
      if: failure() && steps.expensive.outputs.run == 'true'
      env:
        EVIDENCE: mdns-spike-${{ runner.os }}-${{ runner.arch }}.json
      run: cat "$EVIDENCE"

    - name: Upload non-publishing evidence
      if: always() && steps.expensive.outputs.run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
      with:
        name: mdns-spike-${{ runner.os }}-${{ runner.arch }}
        path: mdns-spike-${{ runner.os }}-${{ runner.arch }}*.json
        retention-days: 7

  mdns-spike-intel-pyapp:
    name: mDNS spike Intel PyApp evidence
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened", "reopened", "ready_for_review", "synchronize"]'),
      github.event.action)
    runs-on: macos-15-intel
    permissions:
      contents: read
    concurrency:
      group: mdns-spike-${{ github.event.pull_request.number }}-intel-pyapp
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      with:
        fetch-depth: 0

    - name: Decide whether exact synchronize inputs changed
      id: expensive
      env:
        ACTION: ${{ github.event.action }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.event.after }}
        FULL_PR_FILTER: ${{ needs.changes.outputs.mdns_spike }}
      shell: bash
      run: |
        run=false
        reason=full-pr-filter
        if [[ "$ACTION" == "synchronize" ]]; then
          run=true
          reason=conservative-missing-sha-or-diff
          if [[ -n "$BEFORE" && -n "$AFTER" ]] \
            && git fetch --no-tags origin "$BEFORE" "$AFTER" \
            && changed=$(git diff --name-only "$BEFORE" "$AFTER"); then
            if grep -Eq '^(\.github/workflows/ci\.yml|scripts/spike_mdns_candidates\.py|scripts/mdns_spike_tests/|scripts/mdns_spike_inputs/)' <<<"$changed"; then
              run=true
              reason=synchronize-input-change
            else
              run=false
              reason=synchronize-receipt-only
            fi
          fi
        elif [[ "$FULL_PR_FILTER" == "true" ]]; then
          run=true
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"

    - name: Set up Python 3.12
      if: steps.expensive.outputs.run == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
      with:
        python-version: '3.12'

    - name: Install uv
      if: steps.expensive.outputs.run == 'true'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4   # v10.1.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: '3.12'

    - name: Install pinned Rust toolchain action
      if: steps.expensive.outputs.run == 'true'
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: stable
        targets: x86_64-apple-darwin

    - name: Build exact local wheels and PyApp
      if: steps.expensive.outputs.run == 'true'
      env:
        SOURCE_REVISION: 48b7efbff59656499373b13ef17e3008d125feb5
        PYAPP_PYTHON_VERSION: '3.12'
        PYAPP_EXEC_SPEC: lifx_emulator_app.__main__:main
        PYAPP_UV_ENABLED: 'true'
        PYAPP_UV_VERSION: 0.9.9
        PYAPP_EXPOSE_PYTHON: 'true'
        CARGO_BUILD_TARGET: x86_64-apple-darwin
      shell: bash
      run: |
        set -euo pipefail
        wheels="$RUNNER_TEMP/wheels"
        mkdir -p "$wheels"
        uv build --wheel packages/lifx-emulator-core --out-dir "$wheels"
        git init "$RUNNER_TEMP/lifx-async"
        git -C "$RUNNER_TEMP/lifx-async" remote add origin \
          https://github.com/Djelibeybi/lifx-async.git
        git -C "$RUNNER_TEMP/lifx-async" fetch --depth 1 origin "$SOURCE_REVISION"
        git -C "$RUNNER_TEMP/lifx-async" checkout --detach FETCH_HEAD
        test "$(git -C "$RUNNER_TEMP/lifx-async" rev-parse HEAD)" = "$SOURCE_REVISION"
        cp scripts/mdns_spike_inputs/lifx_direct.py \
          "$RUNNER_TEMP/lifx-async/src/lifx/network/discovery/mdns/responder.py"
        uv build --wheel "$RUNNER_TEMP/lifx-async" --out-dir "$wheels"
        cp -R packages/lifx-emulator "$RUNNER_TEMP/lifx-emulator-app"
        core_wheel=$(find "$wheels" -name 'lifx_emulator_core-*.whl' -print -quit)
        candidate_wheel=$(find "$wheels" -name 'lifx_async-*.whl' -print -quit)
        uv run --frozen python -c \
          'import pathlib,sys; p=pathlib.Path(sys.argv[1]); s=p.read_text(); s=s.replace("lifx-emulator-core>=2.4.0", "lifx-emulator-core @ file://" + sys.argv[2]); marker="dependencies = ["; s=s.replace(marker, marker + "\n    \"lifx-async @ file://" + sys.argv[3] + "\","); s += "\n[tool.hatch.metadata]\nallow-direct-references = true\n"; p.write_text(s)' \
          "$RUNNER_TEMP/lifx-emulator-app/pyproject.toml" "$core_wheel" "$candidate_wheel"
        uv build --wheel "$RUNNER_TEMP/lifx-emulator-app" --out-dir "$wheels"
        app_wheel=$(find "$wheels" -name 'lifx_emulator-[0-9]*.whl' -print -quit)
        git clone --depth 1 --branch v0.26.0 https://github.com/ofek/pyapp.git \
          "$RUNNER_TEMP/pyapp"
        test "$(git -C "$RUNNER_TEMP/pyapp" rev-parse HEAD)" = \
          "a419de7c068cbd0e083194bbe11c741b0497d28c"
        test "$(git -C "$RUNNER_TEMP/pyapp" rev-parse 'HEAD^{tree}')" = \
          "d87b89829042147f7b23c5fe4b5b14034d8164d4"
        project_wheel=$(basename "$app_wheel")
        cp "$app_wheel" "$RUNNER_TEMP/pyapp/$project_wheel"
        cd "$RUNNER_TEMP/pyapp"
        export PYAPP_PROJECT_PATH="$project_wheel"
        rustc -Vv | tee "$RUNNER_TEMP/rustc.txt"
        cargo build --release --target "$CARGO_BUILD_TARGET"
        binary="target/$CARGO_BUILD_TARGET/release/pyapp"
        env "PYAPP_INSTALL_DIR_LIFX-EMULATOR=$RUNNER_TEMP/pyapp-install" \
          "$binary" --help > "$RUNNER_TEMP/first-run.txt"
        env "PYAPP_INSTALL_DIR_LIFX-EMULATOR=$RUNNER_TEMP/pyapp-install" \
          "$binary" self python -c \
          'import importlib.metadata,json; print(json.dumps({n:importlib.metadata.version(n) for n in ("lifx-emulator","lifx-emulator-core","lifx-async")},sort_keys=True))' \
          > "$RUNNER_TEMP/installed-identities.json"
        shasum -a 256 "$wheels"/*.whl "$binary" > "$RUNNER_TEMP/hashes.txt"
        unzip -p "$candidate_wheel" '*/METADATA' > "$RUNNER_TEMP/candidate-METADATA.txt"
        unzip -p "$app_wheel" '*/METADATA' > "$RUNNER_TEMP/app-METADATA.txt"
        cp "$GITHUB_WORKSPACE/scripts/mdns_spike_inputs/active.json" \
          "$RUNNER_TEMP/active-input.json"

    - name: Record Intel PyApp receipt
      if: steps.expensive.outputs.run == 'true'
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        uv run --frozen python scripts/spike_mdns_candidates.py \
          write-intel-pyapp-receipt \
          --output "$RUNNER_TEMP/intel-pyapp-receipt.json" \
          --head-sha "$HEAD_SHA" --run-url "$RUN_URL" \
          --hashes "$RUNNER_TEMP/hashes.txt" \
          --identities "$RUNNER_TEMP/installed-identities.json" \
          --rustc "$RUNNER_TEMP/rustc.txt" \
          --first-run "$RUNNER_TEMP/first-run.txt" \
          --candidate-metadata "$RUNNER_TEMP/candidate-METADATA.txt" \
          --app-metadata "$RUNNER_TEMP/app-METADATA.txt"
        uv run --frozen python scripts/spike_mdns_candidates.py \
          validate-ci-receipt \
          --receipt "$RUNNER_TEMP/intel-pyapp-receipt.json" \
          --head-sha "$HEAD_SHA"

    - name: Upload non-publishing Intel PyApp evidence
      if: always() && steps.expensive.outputs.run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
      with:
        name: mdns-spike-intel-pyapp
        path: |
          ${{ runner.temp }}/active-input.json
          ${{ runner.temp }}/*METADATA.txt
          ${{ runner.temp }}/first-run.txt
          ${{ runner.temp }}/hashes.txt
          ${{ runner.temp }}/installed-identities.json
          ${{ runner.temp }}/intel-pyapp-receipt.json
          ${{ runner.temp }}/rustc.txt
        retention-days: 7

  # Code quality checks
  quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4   # v10.1.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run Ruff format check
      run: uv run ruff format --check .

    - name: Run Ruff linter (with complexity checks)
      run: uv run ruff check .

    - name: Run Pyright type checker
      run: uv run pyright

    - name: Check for security issues
      run: |
        uv pip install bandit
        uv run bandit -r packages/lifx-emulator-core/src/ packages/lifx-emulator/src/

  # Testing matrix across Python versions and platforms
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4   # v10.1.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run unit tests with coverage threshold
      run: uv run --frozen pytest --cov-fail-under=80

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7
      with:
        slug: Djelibeybi/lifx-emulator
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7
      with:
        report_type: test_results
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs:
    - changes
    - quality
    - test
    if: |
      always()
      && needs.changes.outputs.source == 'true'
      && needs.quality.result == 'success'
      && needs.test.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    outputs:
      release-lifx-emulator-core: ${{ steps.release-lifx-emulator-core.outputs.release-lifx-emulator-core || 'false' }}
      release-lifx-emulator: ${{ steps.release-lifx-emulator.outputs.release-lifx-emulator || 'false' }}

    steps:
    - name: Checkout repository on release branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        fetch-depth: 0
        ssh-key: ${{ secrets.DEPLOY_KEY }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4   # v10.1.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Configure git
      run: |
        git config --local user.email "github-actions@github.com"
        git config --local user.name "GitHub Actions"

    - name: Check Python Semantic Release for lifx-emulator-core
      id: check-release-lifx-emulator-core
      if: github.ref_name != 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd packages/lifx-emulator-core/
        uv run --with python-semantic-release semantic-release --noop version

    - name: Check Python Semantic Release for lifx-emulator
      id: check-release-lifx-emulator
      if: github.ref_name != 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd packages/lifx-emulator/
        uv run --with python-semantic-release semantic-release --noop version

    - name: Release lifx-emulator-core
      id: release-lifx-emulator-core
      if: github.ref_name == 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd packages/lifx-emulator-core/

        # Capture output to detect if a release was made
        output=$(uv run --with python-semantic-release semantic-release version 2>&1)
        echo "$output"

        # Check if a release was made (no "No release will be made" message)
        if echo "$output" | grep -q "No release will be made"; then
          echo "release-lifx-emulator-core=false" >> $GITHUB_OUTPUT
        else
          # Publish distribution artifacts to release
          uv run --with python-semantic-release semantic-release publish
          echo "release-lifx-emulator-core=true" >> $GITHUB_OUTPUT
        fi

    - name: Release lifx-emulator
      id: release-lifx-emulator
      if: github.ref_name == 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd packages/lifx-emulator/

        # Capture output to detect if a release was made
        output=$(uv run --with python-semantic-release semantic-release version 2>&1)
        echo "$output"

        # Check if a release was made (no "No release will be made" message)
        if echo "$output" | grep -q "No release will be made"; then
          echo "release-lifx-emulator=false" >> $GITHUB_OUTPUT
        else
          # Publish distribution artifacts to release
          uv run --with python-semantic-release semantic-release publish
          echo "release-lifx-emulator=true" >> $GITHUB_OUTPUT
        fi

    - name: Upload Core Library Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
      with:
        name: lifx-emulator-core-artifacts
        path: packages/lifx-emulator-core/dist

    - name: Upload CLI Package Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
      with:
        name: lifx-emulator-artifacts
        path: packages/lifx-emulator/dist

  deploy-core:
    name: Deploy Core Library to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release-lifx-emulator-core == 'true' }}

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/lifx-emulator-core

    steps:
    - name: Download Core Library Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8
      with:
        name: lifx-emulator-core-artifacts
        path: dist

    - name: Publish lifx-emulator-core to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        packages-dir: dist
        print-hash: true
        verbose: true

  deploy-cli:
    name: Deploy CLI Package to PyPI
    runs-on: ubuntu-latest
    needs:
    - release
    - deploy-core   # CLI depends on core being published first
    if: ${{ needs.release.outputs.release-lifx-emulator == 'true' }}

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/lifx-emulator

    steps:
    - name: Download CLI Package Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8
      with:
