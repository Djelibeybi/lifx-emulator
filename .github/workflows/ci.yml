name: CI

on:
  push:
    branches:
    - main
  pull_request:

env:
  PYTHON_VERSION: '3.14'
  UV_VERSION: 0.12.21

# Default to least privilege; jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      mdns_production: ${{ steps.filter.outputs.mdns_production }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      id: filter
      with:
        filters: |
          source:
            - 'packages/**'
            - 'pyproject.toml'
            - 'uv.lock'
          mdns_production:
            - '.github/workflows/ci.yml'
            - 'packages/lifx-emulator-core/**'
            - 'packages/lifx-emulator/src/lifx_emulator_app/api/services/event_bridge.py'
            - 'scripts/prepare_mdns_oracle.py'
            - 'scripts/mdns_spike_inputs/active.json'
            - 'uv.lock'

  mdns-production-integration:
    name: mDNS production integration (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.mdns_production == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Configure disposable same-host network and verify host daemon
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get update
          sudo apt-get install -y avahi-daemon
          sudo systemctl start avahi-daemon
          pgrep -x avahi-daemon
          sudo ip -6 addr add fd00:3:1::1/128 dev lo
          mdns_interface=$(ip -4 route get 224.0.0.251 | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}')
        else
          pgrep -x mDNSResponder
          sudo ifconfig lo0 inet6 fd00:3:1::1 prefixlen 64 alias
          sudo route -n add -host 224.0.0.251 -interface lo0 >/dev/null 2>&1 || \
            sudo route -n change -host 224.0.0.251 -interface lo0 >/dev/null 2>&1
          test "$(route -n get -inet 224.0.0.251 | awk '/interface:/{print $2}')" = lo0
          mdns_interface=127.0.0.1
        fi
        test -n "$mdns_interface"
        echo "MDNS_TEST_INTERFACE=$mdns_interface" >> "$GITHUB_ENV"
        echo "MDNS_TEST_THREAD_ADDRESS=fd00:3:1::1" >> "$GITHUB_ENV"
    - name: Acquire verified pristine client
      run: uv run scripts/prepare_mdns_oracle.py --destination "${{ runner.temp }}/production-oracle"
    - name: Exercise shipped responder with required real-stack evidence
      env:
        MDNS_INTEGRATION_REQUIRED: '1'
        LIFX_ASYNC_PATH: ${{ runner.temp }}/production-oracle/src
        PYTHONPATH: ${{ runner.temp }}/production-oracle/src
      run: |
        uv run --with "${{ runner.temp }}/production-oracle" pytest \
          packages/lifx-emulator-core/tests/test_mdns_integration.py \
          -q --no-cov -rs --junitxml=mdns-production.xml
        uv run python -c 'import xml.etree.ElementTree as E; r=E.parse("mdns-production.xml"); assert sum(int(s.get("tests", 0)) for s in r.iter("testsuite")) > 0; assert not r.findall(".//skipped")'

  # Code quality checks
  quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run Ruff format check
      run: uv run ruff format --check .

    - name: Run Ruff linter (with complexity checks)
      run: uv run ruff check .

    - name: Run Pyright type checker
      run: uv run pyright

    - name: Check for security issues
      run: |
        uv pip install bandit
        uv run bandit -r packages/lifx-emulator-core/src/ packages/lifx-emulator/src/

  # Testing matrix across Python versions and platforms
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run unit tests with coverage threshold
      run: uv run --frozen pytest --cov-fail-under=80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7
      with:
        slug: Djelibeybi/lifx-emulator
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7
      with:
        report_type: test_results
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs:
    - changes
    - quality
    - test
    if: |
      always()
      && needs.changes.outputs.source == 'true'
      && needs.quality.result == 'success'
      && needs.test.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    outputs:
      release-lifx-emulator-core: ${{ steps.release-lifx-emulator-core.outputs.release-lifx-emulator-core || 'false' }}
      release-lifx-emulator: ${{ steps.release-lifx-emulator.outputs.release-lifx-emulator || 'false' }}

    steps:
    - name: Checkout repository on release branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        fetch-depth: 0
        ssh-key: ${{ secrets.DEPLOY_KEY }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Configure git
      run: |
        git config --local user.email "github-actions@github.com"
        git config --local user.name "GitHub Actions"

    - name: Check Python Semantic Release for lifx-emulator-core
      id: check-release-lifx-emulator-core
      if: github.ref_name != 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd packages/lifx-emulator-core/
        uv run --with python-semantic-release semantic-release --noop version

    - name: Check Python Semantic Release for lifx-emulator
      id: check-release-lifx-emulator
      if: github.ref_name != 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd packages/lifx-emulator/
        uv run --with python-semantic-release semantic-release --noop version

    - name: Release lifx-emulator-core
      id: release-lifx-emulator-core
      if: github.ref_name == 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd packages/lifx-emulator-core/

        # Capture output to detect if a release was made
        output=$(uv run --with python-semantic-release semantic-release version 2>&1)
        echo "$output"

        # Check if a release was made (no "No release will be made" message)
        if echo "$output" | grep -q "No release will be made"; then
          echo "release-lifx-emulator-core=false" >> "$GITHUB_OUTPUT"
        else
          # Publish distribution artifacts to release
          uv run --with python-semantic-release semantic-release publish
          echo "release-lifx-emulator-core=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Release lifx-emulator
      id: release-lifx-emulator
      if: github.ref_name == 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd packages/lifx-emulator/

        # Capture output to detect if a release was made
        output=$(uv run --with python-semantic-release semantic-release version 2>&1)
        echo "$output"

        # Check if a release was made (no "No release will be made" message)
        if echo "$output" | grep -q "No release will be made"; then
          echo "release-lifx-emulator=false" >> "$GITHUB_OUTPUT"
        else
          # Publish distribution artifacts to release
          uv run --with python-semantic-release semantic-release publish
          echo "release-lifx-emulator=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Core Library Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
      with:
        name: lifx-emulator-core-artifacts
        path: packages/lifx-emulator-core/dist

    - name: Upload CLI Package Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
      with:
        name: lifx-emulator-artifacts
        path: packages/lifx-emulator/dist

  deploy-core:
    name: Deploy Core Library to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release-lifx-emulator-core == 'true' }}

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/lifx-emulator-core

    steps:
    - name: Download Core Library Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8
      with:
        name: lifx-emulator-core-artifacts
        path: dist

    - name: Publish lifx-emulator-core to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        packages-dir: dist
        print-hash: true
        verbose: true

  deploy-cli:
    name: Deploy CLI Package to PyPI
    runs-on: ubuntu-latest
    needs:
    - release
    - deploy-core   # CLI depends on core being published first
    if: ${{ needs.release.outputs.release-lifx-emulator == 'true' }}

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/lifx-emulator

    steps:
    - name: Download CLI Package Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8
      with:
        name: lifx-emulator-artifacts
        path: dist

    - name: Publish lifx-emulator to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        packages-dir: dist
        print-hash: true
        verbose: true
